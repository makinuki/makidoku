name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./internal/... ./cmd/...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Type check
        run: pnpm --dir web typecheck
      - name: Test
        run: pnpm --dir web test:run

  # The solver's embedded-browser tests need an interactive session and the WebView2
  # runtime. A Windows runner has both, so this is the only place they can run.
  solver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Self check
        env:
          MAKIDOKU_SOLVER_TEST: "1"
        run: go test ./internal/solver/... -run TestSelfCheck -v

---