name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The web assets are embedded into the binary, so the Go build needs them to
  # exist first. They are built once and reused by both matrix entries.
  web-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build web assets
        run: pnpm --dir web build
      - name: Type check
        run: pnpm --dir web typecheck
      - name: Test
        run: pnpm --dir web test:run
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    needs: web-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./internal/... ./cmd/...
