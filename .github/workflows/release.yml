name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Build headless binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tray:
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build web assets
        run: pnpm --dir web build
      - name: Build tray binary
        env:
          CGO_ENABLED: 1
        run: go build -tags tray -trimpath -ldflags "-s -w -X github.com/makinuki/makidoku/internal/version.Version=${{ github.ref_name }} -X github.com/makinuki/makidoku/internal/version.Commit=${{ github.sha }}" -o makidoku-tray-windows-amd64.exe .
      - name: Attach tray binary to release
        uses: softprops/action-gh-release@v3
        with:
          files: makidoku-tray-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
