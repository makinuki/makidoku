name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build headless binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tray:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            ext: .exe
            artifact: makidoku-tray-windows-amd64.exe
          - os: ubuntu-latest
            goos: linux
            ext: ""
            artifact: makidoku-tray-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install Linux tray dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build web assets
        run: pnpm --dir web build
      - name: Build tray binary
        env:
          CGO_ENABLED: 1
        run: go build -tags tray -trimpath -ldflags "-s -w -X github.com/makinuki/makidoku/internal/version.Version=${{ github.ref_name }} -X github.com/makinuki/makidoku/internal/version.Commit=${{ github.sha }}" -o ${{ matrix.artifact }} .
      - name: Attach tray binary to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
