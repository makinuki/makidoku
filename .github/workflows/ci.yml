name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The web assets are embedded into the binary, so the Go build needs them to
  # exist first. They are built once and reused by both matrix entries.
  web-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build web assets
        run: pnpm --dir web build
      - name: Type check
        run: pnpm --dir web typecheck
      - name: Test
        run: pnpm --dir web test:run
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    needs: web-assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Build
        run: go build ./...
      - name: Vet
        # The unsafeptr analyzer is disabled for one known false positive: a COM
        # interface pointer supplied to a cgo callback has to be converted from a
        # uintptr, which the analyzer cannot distinguish from a real Go pointer.
        # The conversion it would otherwise demand reads a vtable out of the stack
        # and crashes the process, so the analyzer is off rather than the code
        # changed. Every other vet check still runs. See the comment on
        # readCookieList in internal/solver/browser_windows.go.
        run: go vet -unsafeptr=false ./...
      - name: Test
        run: go test ./...
